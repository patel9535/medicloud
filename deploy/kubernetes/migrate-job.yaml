apiVersion: batch/v1
kind: Job
metadata:
  name: medicloud-migrate
  namespace: medicloud
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app: medicloud-api }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: registry.example.com/your-project/medicloud-api:replace-with-commit-sha
          command: ["node", "scripts/migrate.js"]
          envFrom:
            - configMapRef: { name: medicloud-config }
            - secretRef: { name: medicloud-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
