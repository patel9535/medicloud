apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicloud-web
  namespace: medicloud
spec:
  replicas: 2
  selector:
    matchLabels: { app: medicloud-web }
  template:
    metadata:
      labels: { app: medicloud-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: registry.example.com/your-project/medicloud-web:replace-with-commit-sha
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: nginx-tmp, mountPath: /tmp }
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: medicloud-web
  namespace: medicloud
spec:
  selector: { app: medicloud-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medicloud
  namespace: medicloud
spec:
  ingressClassName: nginx
  tls:
    - hosts: [medicloud.example.com]
      secretName: medicloud-tls
  rules:
    - host: medicloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: medicloud-web, port: { number: 80 } }
